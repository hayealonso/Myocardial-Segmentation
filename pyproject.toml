[project]
name = "miocardio-seg"
version = "0.1.0"
description = "Segmentacion del miocardio y diagnostico cardiaco en MRI (ACDC + York) con U-Net 2D"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "nibabel>=5.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

# los modulos viven en la raiz y se importan por nombre; no es un paquete instalable
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: entrena de verdad (segundos), no solo verifica shapes",
    "datos: usa cardiac_data/ o outputs/; se salta si no estan en disco",
]

# torch con CUDA para la RTX 4050 (igual que T2-GEN-ASTRO); sin GPU, comentar este bloque
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
